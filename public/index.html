<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Olla de la Fortuna | V3</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#687386;--line:#dfe4ec;--accent:#6d28d9;--accent2:#4f46e5;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--soft:#f7f8fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#21114f,#4c1d95);color:#fff;padding:26px 5vw;box-shadow:0 4px 18px #0002}header h1{margin:0 0 5px;font-size:clamp(1.7rem,4vw,2.7rem)}header p{margin:0;color:#e9ddff}
main{max-width:1250px;margin:26px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #1111}.half{grid-column:span 6}.third{grid-column:span 4}
h2{margin-top:0}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd3df;border-radius:10px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}button.secondary{background:#eef0f5;color:#252b38}button.ok{background:var(--ok)}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eee7ff;color:#4c1d95;font-weight:800;font-size:.8rem}.status{padding:10px 12px;border-radius:10px;background:#f0f3f8;margin:8px 0}.success{background:#eaf8ef;color:#166534}.warning{background:#fff7e6;color:#92400e}.dangerbox{background:#feecec;color:#991b1b}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.8rem;color:var(--muted)}
.lot{border:2px solid var(--line);border-radius:16px;padding:18px}.lot.active{border-color:var(--accent)}.lot-title{display:flex;gap:12px;align-items:center}.icon{font-size:2rem}.price{font-size:2.2rem;font-weight:900}.timer{font-size:4rem;font-weight:900;text-align:center;letter-spacing:-2px}.timer.urgent{color:var(--danger);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}
.teambar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--soft);border:1px solid var(--line);padding:12px;border-radius:12px}.metric strong{display:block;font-size:1.25rem}.progress{height:10px;background:#e7eaf0;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
.team-form{display:grid;grid-template-columns:1fr 150px;gap:8px;margin:8px 0}.team-form button{background:#eef0f5;color:#252b38}.lot-editor{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.lot-editor-grid{display:grid;grid-template-columns:60px 1.3fr 120px 100px 100px;gap:8px}.copy{font-family:ui-monospace,Consolas,monospace;font-weight:900;letter-spacing:1px}.toast{position:fixed;right:18px;bottom:18px;max-width:460px;background:#1f2937;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:20}.small{font-size:.86rem}.center{text-align:center}.room-code{font-size:2rem;font-weight:950;letter-spacing:4px;color:#4c1d95}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi .metric{min-height:80px}.listbox{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
@media(max-width:850px){.half,.third{grid-column:span 12}.teambar,.kpi{grid-template-columns:1fr}.lot-editor-grid{grid-template-columns:1fr 1fr}.team-form{grid-template-columns:1fr}.timer{font-size:3rem}}
</style></head>
<body>
<header><h1>🥘 LA OLLA DE LA FORTUNA</h1><p>Subasta estratégica del bienestar laboral · V3 multijugador</p></header>
<main id="app"></main><div id="toast" class="toast"></div>
<script>
const socket=io({transports:['websocket','polling'],reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000});
const app=document.getElementById('app'),toast=document.getElementById('toast');let S=null,role=null,myTeam=null,localTimer=null,reconnecting=false;
const LS_ROOM='ollaV3InstructorSession',LS_TEAM='ollaV3TeamSession';
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t){toast.textContent=t;toast.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.display='none',4000)}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=.92;u.pitch=1.05;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>(v.lang||'').toLowerCase().startsWith('es-co'))||vs.find(v=>(v.lang||'').toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}catch(e){}}
function saveInstructor(){if(role==='instructor'&&S)localStorage.setItem(LS_ROOM,JSON.stringify(S))}
function saveTeam(){if(role==='team'&&S&&myTeam)localStorage.setItem(LS_TEAM,JSON.stringify({room:S.code,teamCode:myTeam.code,name:myTeam.name}))}
function clearTimer(){clearInterval(localTimer)}
function render(){if(!S){renderHome();return}if(role==='instructor')renderInstructor();else renderTeam();startCountdown()}
socket.on('connect',()=>{msg('Conectado al servidor. Selecciona cómo deseas ingresar.');});
socket.on('errorMsg',m=>{msg(m);reconnecting=false});
socket.on('roomCreated',x=>{reconnecting=false;msg('Sala creada: '+x.code);localStorage.setItem(LS_ROOM,JSON.stringify({...S,code:x.code,sessionToken:x.sessionToken}))});
socket.on('roomRestored',x=>{reconnecting=false;msg('Sesión de instructora recuperada: '+x.code)});
socket.on('teamJoined',x=>{reconnecting=false;myTeam=x.team;saveTeam();msg('Equipo autenticado correctamente.')});
socket.on('state',s=>{if(!role)return;S=s;if(role==='instructor')saveInstructor();if(role==='team'&&myTeam){myTeam=S.teams.find(t=>t.id===myTeam.id)||myTeam;saveTeam()}render()});
socket.on('justificationStart',x=>{msg(`¡${x.teamName} ganó! Tiene máximo 60 segundos para justificar.`);speak(`El equipo ${x.teamName} debe registrar su justificación. Tiene sesenta segundos.`)});
socket.on('justificationSaved',()=>msg('Justificación guardada. La actividad puede continuar.'));
socket.on('auctionStart',()=>speak('Nueva puja abierta.'));
socket.on('disconnect',()=>{if(role)msg('Conexión interrumpida. Intentando reconectar…')});
function renderHome(){clearTimer();app.innerHTML=`<div class="grid"><section class="card half"><h2>🎓 Propósito pedagógico</h2><p>Simular decisiones de bienestar con recursos limitados mediante <b>Diagnóstico → Priorización → Presupuesto → Decisión → Planeación</b>.</p><p class="badge">“No gana quien gasta más. Gana la decisión que puede justificarse técnica y estratégicamente.”</p></section><section class="card half"><h2>👩‍🏫 Instructor</h2><p class="muted">Crea la actividad, preconfigura de 2 a 10 equipos y entrega a cada equipo su código.</p><button onclick="showCreate()">Preparar simulación</button></section><section class="card half"><h2>👥 Equipo aprendiz</h2><p class="muted">Ingresa con el código de sala y el código asignado por la instructora.</p><button class="secondary" onclick="showTeamJoin()">Ingresar como equipo</button></section><section class="card half"><h2>🔄 Recuperación de sesión</h2><p class="muted">La V3 guarda en el navegador la sesión de instructora o equipo para facilitar la reconexión si la conexión se interrumpe. La recuperación es manual para permitir usar varias ventanas del mismo navegador sin modo incógnito.</p><button class="secondary" onclick="recover()">Recuperar mi sesión</button></section><section class="card"><h2>💡 Pregunta guía</h2><p style="font-size:1.3rem"><b>¿En qué invertirías si el presupuesto no alcanza para todo?</b></p><p>La actividad busca argumentar decisiones, no simplemente “ganar” una subasta.</p></section></div>`}
const DEFAULT_LOTS=[['🧠','Salud mental y manejo del estrés',15000,5,'Alta'],['🏃','Actividad física y hábitos saludables',10000,4,'Alta'],['👨‍👩‍👧‍👦','Integración familiar',8000,3,'Media'],['💬','Competencias socioemocionales',12000,5,'Alta'],['🌿','Descanso y recuperación',7000,4,'Media'],['🏆','Reconocimiento al desempeño',9000,3,'Media']];
function showCreate(){role='instructor';app.innerHTML=`<div class="grid"><section class="card half"><h2>👩‍🏫 Preparar simulación</h2><label>Nombre de la actividad</label><input id="activity" value="La Olla de la Fortuna"><label>Presupuesto por equipo (COP)</label><input id="budget" type="number" min="1" value="100000"><label>Incremento mínimo de puja</label><input id="inc" type="number" min="1" value="1000"><label>Duración de cada lote (segundos)</label><input id="duration" type="number" min="15" value="60"><label><input id="noc" type="checkbox" style="width:auto"> No permitir pujas consecutivas del mismo equipo</label><label>Número de equipos</label><input id="teamCount" type="number" min="2" max="10" value="4" oninput="drawTeams()"><div id="teamInputs"></div><div class="actions"><button onclick="createRoom()">🚀 Crear sala y equipos</button><button class="secondary" onclick="role=null;renderHome()">Volver</button></div></section><section class="card"><h2>📋 Reglas de la actividad</h2><ol><li>Se requieren <b>2 a 10 equipos</b>.</li><li>La instructora crea los equipos y sus códigos.</li><li>La subasta solo inicia cuando todos estén autenticados.</li><li>El servidor valida saldo, incrementos y ganador.</li><li>El equipo ganador tiene <b>máximo 60 segundos</b> para justificar.</li><li>La justificación no tiene límite de caracteres y puede guardarse antes de los 60 segundos.</li><li>La instructora puede cerrar un lote manualmente.</li></ol><div class="status warning">💡 Comparte a cada equipo solamente su código de equipo.</div></section><section class="card"><h2>🧩 Lotes</h2><div id="lotsForm"></div></section></div>`;drawTeams();drawLots()}
function drawTeams(){const c=Math.min(10,Math.max(2,Number($('#teamCount')?.value)||4));const old=[...document.querySelectorAll('.teamName')].map(x=>x.value);const box=$('#teamInputs');if(!box)return;box.innerHTML=Array.from({length:c},(_,i)=>`<div class="team-form"><input class="teamName" value="${esc(old[i]||`Equipo ${i+1}`)}" placeholder="Nombre del equipo ${i+1}"><span class="status center">Código automático</span></div>`).join('')}
function drawLots(){const box=$('#lotsForm');if(!box)return;box.innerHTML=DEFAULT_LOTS.map((l,i)=>`<div class="lot-editor"><div class="lot-editor-grid"><input class="lotIcon" value="${l[0]}"><input class="lotName" value="${l[1]}"><input class="lotStart" type="number" value="${l[2]}"><select class="lotImpact"><option ${l[3]===1?'selected':''}>1</option><option ${l[3]===2?'selected':''}>2</option><option ${l[3]===3?'selected':''}>3</option><option ${l[3]===4?'selected':''}>4</option><option ${l[3]===5?'selected':''}>5</option></select><select class="lotPriority"><option ${l[4]==='Alta'?'selected':''}>Alta</option><option ${l[4]==='Media'?'selected':''}>Media</option><option ${l[4]==='Baja'?'selected':''}>Baja</option></select></div><input class="lotDesc" style="margin-top:8px" value="${esc(l[1]+'. Acción de bienestar orientada a responder una necesidad identificada en el diagnóstico.')}"></div>`).join('')}
function collectLots(){return [...document.querySelectorAll('.lot-editor')].map((e,i)=>({id:'L'+(i+1),icon:e.querySelector('.lotIcon').value,name:e.querySelector('.lotName').value,category:'Bienestar',description:e.querySelector('.lotDesc').value,start:+e.querySelector('.lotStart').value,impact:+e.querySelector('.lotImpact').value,priority:e.querySelector('.lotPriority').value}))}
function createRoom(){const names=[...document.querySelectorAll('.teamName')].map(x=>x.value.trim());if(names.length<2||names.some(x=>!x))return msg('Completa los nombres de todos los equipos.');const teams=names.map(name=>({name}));socket.emit('createRoom',{activityName:$('#activity').value,budget:+$('#budget').value,minIncrement:+$('#inc').value,lotDuration:+$('#duration').value,noConsecutive:$('#noc').checked,teams,lots:collectLots()})}
function showTeamJoin(){role='team';app.innerHTML=`<div class="grid"><section class="card half"><h2>👥 Ingreso del equipo</h2><label>Código de sala</label><input id="room" maxlength="6" placeholder="ABC123"><label>Código de equipo</label><input id="teamCode" maxlength="12" placeholder="Código entregado por la instructora"><div class="actions"><button onclick="joinTeam()">🔐 Autenticar equipo</button><button class="secondary" onclick="role=null;renderHome()">Volver</button></div><p class="muted small">No necesitas escribir el nombre: el código identifica al equipo.</p></section><section class="card"><h2>🔒 Seguridad del aula</h2><p>El código de sala identifica la actividad. El código de equipo identifica al equipo preconfigurado y permite reconectarlo si pierde temporalmente la conexión.</p></section></div>`}
function joinTeam(){const room=$('#room').value.trim().toUpperCase(),tc=$('#teamCode').value.trim().toUpperCase();if(!room||!tc)return msg('Completa el código de sala y el código de equipo.');localStorage.setItem(LS_TEAM,JSON.stringify({room,teamCode:tc}));socket.emit('joinTeam',{code:room,teamCode:tc})}
function recover(){const r=JSON.parse(localStorage.getItem(LS_ROOM)||'null'),t=JSON.parse(localStorage.getItem(LS_TEAM)||'null');if(r){role='instructor';reconnecting=true;socket.emit('restoreInstructor',r)}else if(t){role='team';reconnecting=true;socket.emit('joinTeam',t)}else msg('No hay una sesión guardada en este navegador.')}
function renderInstructor(){const rows=S.teams.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td class="copy">${esc(t.code)}</td><td>${t.authenticated?'✅':'⏳'}</td><td>${t.connected?'🟢':'⚪'}</td><td>${money(t.balance)}</td><td>${t.wins}</td></tr>`).join('');const lot=S.currentLotData;app.innerHTML=`<div class="grid"><section class="card"><h2>👩‍🏫 Panel de la instructora <span class="badge">Sala ${S.code}</span></h2><div class="room-code">${S.code}</div><p><b>${esc(S.activityName)}</b></p><div class="status ${S.allAuthenticated?'success':'warning'}">${S.allAuthenticated?'✅ Todos los equipos están autenticados. Puedes iniciar la subasta.':'⏳ Esperando autenticación: '+S.teams.filter(t=>t.authenticated).length+'/'+S.teams.length+' equipos.'}</div><div class="actions"><button onclick="start()" ${S.phase!=='lobby'||!S.allAuthenticated?'disabled':''}>🚀 Iniciar simulación</button><button onclick="nextLot()" ${S.phase!=='between'?'disabled':''}>Siguiente lote</button><button class="danger" onclick="endLot()" ${S.phase!=='auction'?'disabled':''}>Cerrar lote ahora</button><button class="secondary" onclick="finish()" ${S.phase==='finished'?'disabled':''}>Finalizar simulación</button><button class="secondary" onclick="downloadCSV()">📊 Exportar CSV</button><button class="secondary" onclick="goHome()">🏠 Volver al inicio</button></div></section><section class="card"><h2>👥 Equipos y códigos</h2><p class="muted">Entrega a cada equipo únicamente su código. No es necesario compartir los códigos de los demás.</p><table><thead><tr><th>Equipo</th><th>Código</th><th>Auth</th><th>Conexión</th><th>Saldo</th><th>Ganados</th></tr></thead><tbody>${rows}</tbody></table></section>${lot?`<section class="card half"><h2>${lot.icon} Lote actual</h2><div class="lot active"><div class="lot-title"><div class="icon">${lot.icon}</div><div><b>${esc(lot.name)}</b><div class="muted">Prioridad ${lot.priority} · Impacto ${lot.impact}/5</div></div></div><p>${esc(lot.description)}</p><div class="price">${money(S.currentBid||lot.start)}</div><p>Última puja: <b>${esc(S.currentBidderName||'—')}</b></p></div></section><section class="card half"><h2>⏱️ Tiempo oficial</h2><div id="timer" class="timer">—</div><p class="muted">El cronómetro lo controla el servidor.</p></section>`:''}<section class="card"><h2>📝 Historial de pujas</h2><table><thead><tr><th>Hora</th><th>Equipo</th><th>Valor</th></tr></thead><tbody>${S.bids.slice().reverse().map(b=>`<tr><td>${new Date(b.at).toLocaleTimeString()}</td><td>${esc(b.teamName)}</td><td>${money(b.amount)}</td></tr>`).join('')||'<tr><td colspan="3">No hay pujas en el lote actual.</td></tr>'}</tbody></table></section>${S.phase==='finished'?resultsHTML(S.teams):''}</div>`}
function renderTeam(){const t=S.teams.find(x=>x.id===myTeam?.id)||myTeam;myTeam=t;const lot=S.currentLotData,pending=S.phase==='justification'&&S.pendingJustification?.teamId===t?.id;const min=lot?(S.currentBid?S.currentBid+S.minIncrement:lot.start):0;app.innerHTML=`<div class="grid"><section class="card"><h2>👥 ${esc(t?.name||'Equipo')} <span class="badge">Sala ${S.code}</span></h2><div class="teambar"><div class="metric">Presupuesto<strong>${money(S.budget)}</strong></div><div class="metric">Invertido<strong>${money(t?.invested)}</strong></div><div class="metric">Saldo<strong>${money(t?.balance)}</strong></div></div><div class="progress" style="margin-top:12px"><i style="width:${Math.min(100,(t?.invested||0)/S.budget*100)}%"></i></div><div class="actions" style="margin-top:12px"><button class="secondary" onclick="goHome()">🏠 Volver al inicio</button></div></section>${lot?`<section class="card half"><h2>${lot.icon} ${esc(lot.name)}</h2><p>${esc(lot.description)}</p><span class="badge">Prioridad ${lot.priority}</span> <span class="badge">Impacto ${lot.impact}/5</span><div class="price">${money(S.currentBid||lot.start)}</div><p>Último equipo: <b>${esc(S.currentBidderName||'Ninguno')}</b></p></section><section class="card half"><h2>⏱️ Tiempo restante</h2><div id="timer" class="timer">—</div><label>Tu puja (mínimo ${money(min)})</label><div style="display:flex;gap:8px"><input id="bid" type="number" min="${min}" step="${S.minIncrement}" value="${min}"><button onclick="bid()" ${S.phase!=='auction'?'disabled':''}>💰 Pujar</button></div></section>`:''}${pending?`<section class="card"><h2>🏆 ¡Lote ganado! Justificación estratégica</h2><p>Relaciona tu decisión con <b>diagnóstico, prioridad, impacto y recursos disponibles</b>.</p><div id="jtimer" class="timer">60</div><textarea id="just" placeholder="Escribe tu justificación. No hay límite de caracteres. Puedes guardar antes de que termine el tiempo."></textarea><div class="actions"><button class="ok" onclick="saveJust()">💾 Guardar ahora</button></div></section>`:''}<section class="card"><h2>📌 Necesidades adquiridas</h2>${t?.needs?.map(n=>`<div class="status"><b>${esc(n.name)}</b> · ${money(n.value)}<br><span class="muted">${esc(n.justification||'Justificación pendiente/no registrada')}</span></div>`).join('')||'<p class="muted">Aún no has adquirido necesidades.</p>'}</section><section class="card"><h2>🧠 Reflexión final</h2><p>1. ¿La necesidad por la que más pagaron era realmente la de mayor prioridad?</p><p>2. ¿Tomaron decisiones basadas en el diagnóstico o en la presión de la competencia?</p><p>3. ¿Qué necesidades quedaron sin financiar?</p><p>4. ¿Qué criterios utilizarían para distribuir justamente un presupuesto limitado?</p><p>5. ¿Qué tendría que hacer un responsable de bienestar para que estas decisiones sean técnicas, justificadas y no producto de la intuición?</p><textarea id="reflections" placeholder="Registra aquí las respuestas y conclusiones del equipo.">${esc((t?.reflections||[])[0]||'')}</textarea><button onclick="saveRefs()">Guardar reflexión</button></section>${S.phase==='finished'?resultsHTML([t]):''}</div>`}
function resultsHTML(list){return `<section class="card"><h2>🏁 Resultados</h2>${list.map(t=>`<div class="status"><b>${esc(t.name)}</b> · Invertido ${money(t.invested)} · Saldo ${money(t.balance)} · Uso ${S.budget?((t.invested/S.budget)*100).toFixed(1):0}%<br>${t.needs.map(n=>`• ${esc(n.name)}: ${money(n.value)} — ${esc(n.justification||'Sin justificación')}`).join('<br>')||'Sin adquisiciones.'}</div>`).join('')}<p><b>Reconocimientos pedagógicos para analizar:</b> mayor inversión, mejor equilibrio presupuestal, mayor coherencia diagnóstico–decisión, mejor argumentación y decisión más estratégica.</p><p style="font-size:1.15rem"><b>¿Qué se siente decidir el bienestar de otros cuando el presupuesto no alcanza para todo?</b></p><p>La planeación del bienestar no consiste en escoger lo que más nos gusta, sino en tomar decisiones justificadas a partir de necesidades, prioridades, recursos y criterios técnicos.</p></section>`}
function start(){socket.emit('start')}function nextLot(){socket.emit('nextLot')}function endLot(){socket.emit('endLot')}function finish(){socket.emit('finishSimulation')}function bid(){const v=Number($('#bid').value);socket.emit('placeBid',{amount:v})}function saveJust(){socket.emit('saveJustification',{text:$('#just').value})}function saveRefs(){socket.emit('saveReflections',{reflections:[$('#reflections').value]});msg('Reflexión guardada.')}
function goHome(){clearTimer();role=null;S=null;myTeam=null;reconnecting=false;renderHome();msg('Has vuelto a la pantalla de inicio. La sala no se elimina.')}
function downloadCSV(){if(S?.code)window.open('/api/room/'+S.code+'/export','_blank')}
function startCountdown(){clearTimer();localTimer=setInterval(()=>{const el=$('#timer');if(el&&S?.lotEndsAt){const sec=Math.max(0,Math.ceil((S.lotEndsAt-Date.now())/1000));el.textContent=sec+' s';el.classList.toggle('urgent',sec<=10)}const jt=$('#jtimer');if(jt&&S?.pendingJustification){const sec=Math.max(0,Math.ceil((S.pendingJustification.deadline-Date.now())/1000));jt.textContent=sec+' s';jt.classList.toggle('urgent',sec<=10)}},250)}
renderHome();
</script></body></html>
