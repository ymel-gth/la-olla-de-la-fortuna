<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Olla de la Fortuna | V2</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#687386;--line:#dfe4ec;--accent:#6d28d9;--accent2:#4f46e5;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#21114f,#4c1d95);color:#fff;padding:26px 5vw;box-shadow:0 4px 18px #0002}
header h1{margin:0 0 5px;font-size:clamp(1.7rem,4vw,2.7rem)} header p{margin:0;color:#e9ddff}
main{max-width:1250px;margin:26px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{grid-column:span 12;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #1111}.half{grid-column:span 6}.third{grid-column:span 4}
h2{margin-top:0}.muted{color:var(--muted)}label{display:block;font-weight:700;font-size:.9rem;margin:10px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd3df;border-radius:10px;font:inherit;background:#fff}textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}button.secondary{background:#eef0f5;color:#252b38}button.ok{background:var(--ok)}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eee7ff;color:#4c1d95;font-weight:800;font-size:.8rem}.status{padding:10px 12px;border-radius:10px;background:#f0f3f8;margin:8px 0}.success{background:#eaf8ef;color:#166534}.warning{background:#fff7e6;color:#92400e}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.8rem;color:var(--muted)}
.hidden{display:none!important}.lot{border:2px solid var(--line);border-radius:16px;padding:18px}.lot.active{border-color:var(--accent)}.lot-title{display:flex;gap:12px;align-items:center}.icon{font-size:2rem}.price{font-size:2.2rem;font-weight:900}.timer{font-size:4rem;font-weight:900;text-align:center;letter-spacing:-2px}.timer.urgent{color:var(--danger);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}
.bidrow{display:flex;gap:8px;align-items:end}.bidrow>div{flex:1}.teambar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7f8fb;border:1px solid var(--line);padding:12px;border-radius:12px}.metric strong{display:block;font-size:1.25rem}
.progress{height:10px;background:#e7eaf0;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6)}
.lots-editor{display:grid;gap:10px}.lot-editor{border:1px solid var(--line);border-radius:12px;padding:12px}.lot-editor-grid{display:grid;grid-template-columns:70px 1fr 140px 110px 110px;gap:8px}
.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#1f2937;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:10}
@media(max-width:850px){.half,.third{grid-column:span 12}.lot-editor-grid{grid-template-columns:1fr 1fr}.teambar{grid-template-columns:1fr}.timer{font-size:3rem}}
</style>
</head>
<body>
<header><h1>🥘 LA OLLA DE LA FORTUNA</h1><p>Subasta estratégica del bienestar laboral · V2 multijugador</p></header>
<main id="app"></main><div id="toast" class="toast"></div>
<script>
const socket=io(); let S=null, role=null, myTeam=null, roomCode=null, instructor=false, localTimer=null;
const app=document.getElementById("app"), toast=document.getElementById("toast");
const $=(s)=>document.querySelector(s);
const money=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
function msg(t){toast.textContent=t;toast.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.display="none",3500)}
socket.on("errorMsg",msg); socket.on("state",s=>{S=s; render()});
socket.on("roomCreated",x=>{roomCode=x.code; instructor=true; msg("Sala creada: "+x.code)});
socket.on("joined",x=>{myTeam=x.team; msg("Equipo autenticado. Código: "+x.teamCode)});
socket.on("justificationStart",x=>{msg("¡Ganaron el lote! Tienen máximo 60 segundos para justificar."); speak(`El equipo ${x.teamName} debe registrar su justificación. Tiene sesenta segundos.`)});
socket.on("justificationSaved",()=>msg("Justificación guardada. La subasta continúa."));
socket.on("auctionStart",x=>{speak("Nueva puja abierta.");});
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang="es-CO";u.rate=.92;u.pitch=1.05;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang?.toLowerCase().startsWith("es-co"))||vs.find(v=>v.lang?.toLowerCase().startsWith("es"))||null;speechSynthesis.speak(u)}catch(e){}}
function render(){ if(!S){renderHome();return} if(role==="instructor") renderInstructor(); else renderTeam(); startCountdown();}
function renderHome(){
app.innerHTML=`<div class="grid">
<section class="card half"><h2>🎓 Propósito pedagógico</h2><p>Simular decisiones de bienestar con recursos limitados. La secuencia es <b>Diagnóstico → Priorización → Presupuesto → Decisión → Planeación</b>.</p><p class="badge">“No gana quien gasta más. Gana la decisión que puede justificarse técnica y estratégicamente.”</p></section>
<section class="card half"><h2>👩‍🏫 Instructor</h2><p class="muted">Crea una sala para 2–10 equipos. No necesitas instalar nada para usar la versión publicada.</p><button onclick="showCreate()">Preparar simulación</button></section>
<section class="card half"><h2>👥 Equipo aprendiz</h2><p class="muted">Ingresa al código de sala y autentícate con tu nombre y código de equipo.</p><button class="secondary" onclick="showJoin()">Ingresar como equipo</button></section>
<section class="card"><h2>💡 Pregunta guía</h2><p style="font-size:1.3rem"><b>¿En qué invertirías si el presupuesto no alcanza para todo?</b></p><p>La actividad busca argumentar decisiones, no simplemente “ganar” una subasta.</p></section></div>`;
}
function showCreate(){
role="instructor"; app.innerHTML=`<div class="grid"><section class="card half"><h2>Preparar simulación</h2>
<label>Nombre de la actividad</label><input id="activity" value="La Olla de la Fortuna">
<label>Presupuesto por equipo (COP)</label><input id="budget" type="number" min="1" value="100000">
<label>Incremento mínimo de puja</label><input id="inc" type="number" min="1" value="1000">
<label>Duración de cada lote (segundos)</label><input id="duration" type="number" min="15" value="60">
<label><input id="noc" type="checkbox" style="width:auto"> No permitir pujas consecutivas del mismo equipo</label>
<div class="actions"><button onclick="createRoom()">Crear sala</button><button class="secondary" onclick="role=null;renderHome()">Volver</button></div></section>
<section class="card"><h2>Reglas esenciales</h2><ol><li>Mínimo 2 equipos y máximo 10.</li><li>Todos deben autenticarse antes de iniciar.</li><li>El servidor valida saldo, incrementos y ganador.</li><li>Al ganar, el equipo tiene <b>máximo 60 segundos</b> para justificar.</li><li>La justificación no tiene límite de caracteres y puede guardarse inmediatamente.</li><li>El instructor puede cerrar manualmente un lote.</li></ol></section></div>`;
}
function createRoom(){socket.emit("createRoom",{activityName:$("#activity").value,budget:+$("#budget").value,minIncrement:+$("#inc").value,lotDuration:+$("#duration").value,noConsecutive:$("#noc").checked});}
function showJoin(){role="team"; app.innerHTML=`<div class="grid"><section class="card half"><h2>Ingresar a una sala</h2><label>Código de sala</label><input id="code" placeholder="ABC123" maxlength="6"><label>Nombre del equipo</label><input id="teamName" placeholder="Equipo Horizonte"><label>Código de equipo</label><input id="teamCode" placeholder="Se entrega al crear el equipo"><div class="actions"><button onclick="join()">Ingresar / autenticar</button><button class="secondary" onclick="role=null;renderHome()">Volver</button></div><p class="muted">Si es tu primera entrada, deja vacío el código de equipo; el sistema generará uno.</p></section><section class="card"><h2>🔐 Autenticación de aula</h2><p>El código de sala identifica la actividad. El código de equipo permite reconectar el mismo equipo si pierde la conexión.</p></section></div>`}
function join(){roomCode=$("#code").value.trim().toUpperCase();const name=$("#teamName").value.trim();let tc=$("#teamCode").value.trim().toUpperCase();socket.emit("joinRoom",{code:roomCode,name,teamCode:tc||undefined})}
function renderInstructor(){
const teamRows=S.teams.map(t=>`<tr><td>${t.name}</td><td><span class="badge">${t.code}</span></td><td>${t.authenticated?"✅":"⏳"}</td><td>${t.connected?"🟢":"⚪"}</td><td>${money(t.balance)}</td><td>${t.wins}</td></tr>`).join("");
const lot=S.currentLotData;
app.innerHTML=`<div class="grid">
<section class="card"><h2>👩‍🏫 Panel del instructor <span class="badge">Sala ${S.code}</span></h2><p>${S.activityName}</p><div class="status ${S.allAuthenticated?"success":"warning"}">${S.allAuthenticated?"Todos los equipos están autenticados. Puedes iniciar.":"Esperando autenticación: "+S.teams.length+"/2–10 equipos."}</div><div class="actions"><button onclick="start()" ${S.phase!=="lobby"||!S.allAuthenticated?"disabled":""}>🚀 Iniciar simulación</button><button onclick="nextLot()" ${S.phase!=="between"?"disabled":""}>Siguiente lote</button><button class="danger" onclick="endLot()" ${S.phase!=="auction"?"disabled":""}>Cerrar lote ahora</button><button class="secondary" onclick="finish()" ${S.phase==="finished"?"disabled":""}>Finalizar simulación</button><button class="secondary" onclick="downloadCSV()">📊 Exportar CSV</button></div></section>
<section class="card"><h2>👥 Equipos</h2><table><thead><tr><th>Equipo</th><th>Código</th><th>Auth</th><th>Conexión</th><th>Saldo</th><th>Logros</th></tr></thead><tbody>${teamRows||"<tr><td colspan=6>Aún no hay equipos.</td></tr>"}</tbody></table></section>
${lot?`<section class="card half"><h2>${lot.icon} Lote actual</h2><div class="lot active"><div class="lot-title"><div class="icon">${lot.icon}</div><div><b>${lot.name}</b><div class="muted">${lot.category} · Prioridad ${lot.priority} · Impacto ${lot.impact}/5</div></div></div><p>${lot.description}</p><div class="price">${money(S.currentBid||lot.start)}</div><p>Última puja: <b>${S.currentBidderName||"—"}</b></p></div></section><section class="card half"><h2>⏱️ Tiempo</h2><div id="timer" class="timer">—</div><p class="muted">La hora oficial la controla el servidor.</p></section>`:""}
<section class="card"><h2>📝 Historial de pujas del lote</h2><table><thead><tr><th>Hora</th><th>Equipo</th><th>Valor</th></tr></thead><tbody>${S.bids.slice().reverse().map(b=>`<tr><td>${new Date(b.at).toLocaleTimeString()}</td><td>${b.teamName}</td><td>${money(b.amount)}</td></tr>`).join("")||"<tr><td colspan=3>No hay pujas.</td></tr>"}</tbody></table></section>
<section class="card"><h2>⚙️ Configuración de lotes</h2><p class="muted">Los lotes se pueden editar antes de crear la sala. Para una edición completa de una sala ya creada, reinicia la preparación.</p>${S.lots.map(l=>`<div class="lot-editor"><b>${l.icon} ${l.name}</b> · ${l.category} · Inicio ${money(l.start)} · Impacto ${l.impact}/5 · ${l.priority}</div>`).join("")}</section>
${S.phase==="finished"?resultsHTML():""}
</div>`;
}
function renderTeam(){
const t=S.teams.find(x=>x.id===myTeam?.id)||myTeam; myTeam=t;
const lot=S.currentLotData, pending=S.phase==="justification"&&S.teams.find(x=>x.id===S.currentBidderId)?.id===t?.id;
const min=lot?(S.currentBid?S.currentBid+S.minIncrement:lot.start):0;
app.innerHTML=`<div class="grid"><section class="card"><h2>👥 ${t?.name||"Equipo"} <span class="badge">Sala ${S.code}</span></h2><div class="teambar"><div class="metric">Presupuesto<strong>${money(S.budget)}</strong></div><div class="metric">Invertido<strong>${money(t?.invested)}</strong></div><div class="metric">Saldo<strong>${money(t?.balance)}</strong></div></div><div class="progress" style="margin-top:12px"><i style="width:${Math.min(100,(t?.invested||0)/S.budget*100)}%"></i></div></section>
${lot?`<section class="card half"><h2>${lot.icon} ${lot.name}</h2><p>${lot.description}</p><span class="badge">Prioridad ${lot.priority}</span> <span class="badge">Impacto ${lot.impact}/5</span><div class="price">${money(S.currentBid||lot.start)}</div><p>Último equipo: <b>${S.currentBidderName||"Ninguno"}</b></p></section><section class="card half"><h2>⏱️ Tiempo restante</h2><div id="timer" class="timer">—</div><div class="bidrow"><div><label>Tu puja (mínimo ${money(min)})</label><input id="bid" type="number" min="${min}" step="${S.minIncrement}" value="${min}"></div><button onclick="bid()" ${S.phase!=="auction"?"disabled":""}>💰 Pujar</button></div></section>`:""}
${pending?`<section class="card"><h2>🏆 ¡Lote ganado! Justificación estratégica</h2><p>Explica por qué esta necesidad merece la inversión, relacionándola con <b>diagnóstico, prioridad, impacto y recursos disponibles</b>.</p><div id="jtimer" class="timer">60</div><textarea id="just" placeholder="Escribe tu justificación. No hay límite de caracteres. Puedes guardar antes de que termine el tiempo."></textarea><div class="actions"><button class="ok" onclick="saveJust()">💾 Guardar ahora</button></div></section>`:""}
<section class="card"><h2>📌 Tus necesidades adquiridas</h2>${t.needs?.map(n=>`<div class="status"><b>${n.name}</b> · ${money(n.value)}<br><span class="muted">${n.justification||"Justificación pendiente/no registrada"}</span></div>`).join("")||"<p class=muted>Aún no has adquirido necesidades.</p>"}</section>
<section class="card"><h2>🧠 Reflexión final</h2><p>1. ¿La necesidad por la que más pagaron era realmente la de mayor prioridad?</p><p>2. ¿Tomaron decisiones basadas en el diagnóstico o en la presión de la competencia?</p><p>3. ¿Qué necesidades quedaron sin financiar?</p><p>4. ¿Qué criterios utilizarían para distribuir justamente un presupuesto limitado?</p><p>5. ¿Qué tendría que hacer un responsable de bienestar para que estas decisiones sean técnicas, justificadas y no producto de la intuición?</p><textarea id="reflections" placeholder="Registra aquí las respuestas y conclusiones del equipo."></textarea><button onclick="saveRefs()">Guardar reflexión</button></section>${S.phase==="finished"?resultsHTML(t):""}</div>`;
}
function resultsHTML(team){
if(!S) return ""; const list=team?[team]:S.teams;
return `<section class="card"><h2>🏁 Resultados</h2>${list.map(t=>`<div class="status"><b>${t.name}</b> · Invertido ${money(t.invested)} · Saldo ${money(t.balance)} · Uso ${S.budget?((t.invested/S.budget)*100).toFixed(1):0}%<br>${t.needs.map(n=>`• ${n.name}: ${money(n.value)}`).join("<br>")||"Sin adquisiciones."}</div>`).join("")}<p><b>Reconocimientos pedagógicos para analizar:</b> mayor inversión, mejor equilibrio presupuestal, mayor coherencia diagnóstico–decisión, mejor argumentación y decisión más estratégica.</p><p style="font-size:1.15rem"><b>¿Qué se siente decidir el bienestar de otros cuando el presupuesto no alcanza para todo?</b></p><p>La planeación del bienestar no consiste en escoger lo que más nos gusta, sino en tomar decisiones justificadas a partir de necesidades, prioridades, recursos y criterios técnicos.</p></section>`;
}
function start(){socket.emit("start")} function nextLot(){socket.emit("nextLot")} function endLot(){socket.emit("endLot")} function finish(){socket.emit("finishSimulation")}
function bid(){socket.emit("placeBid",{amount:+$("#bid").value})}
function saveJust(){socket.emit("saveJustification",{text:$("#just").value})}
function saveRefs(){socket.emit("saveReflections",{reflections:[$("#reflections").value]});msg("Reflexión guardada.")}
function downloadCSV(){window.open("/api/room/"+S.code+"/export","_blank")}
function startCountdown(){
clearInterval(localTimer); localTimer=setInterval(()=>{
 const el=$("#timer"); if(el&&S?.lotEndsAt){const sec=Math.max(0,Math.ceil((S.lotEndsAt-Date.now())/1000));el.textContent=sec+" s";el.classList.toggle("urgent",sec<=10)}
 const jt=$("#jtimer"); if(jt&&S?.pendingJustification){const sec=Math.max(0,Math.ceil((S.pendingJustification.deadline-Date.now())/1000));jt.textContent=sec+" s";jt.classList.toggle("urgent",sec<=10)}
},250);
}
renderHome();
</script>
</body></html>
